server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8

spring:
  profiles:
    active: dev
  application:
    name: gj-mall-app
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gj.mall.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 自定义业务配置
mall:
  jwt:
    secret: gj-mall-shop-default-secret-key-please-change-me-in-production-32bytes
    access-expire: 7200
    refresh-expire: 604800
  pay:
    mode: mock   # mock | real
  order:
    timeout-minutes: 30   # 待付款订单超时（分钟），dev 可调小（如 1）联调超时取消
  upload:
    path: ${MALL_UPLOAD_PATH:uploads}
    url-prefix: /uploads
    max-image-size: 10485760
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.gj.mall

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info
